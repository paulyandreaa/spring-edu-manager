<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${alumno.id != null} ? '✏️ Editar Alumno' : '➕ Nuevo Alumno'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2 th:text="${alumno.id != null} ? '✏️ Editar Alumno' : '➕ Nuevo Alumno'"></h2>

        <form th:action="${alumno.id != null} ? 
                         @{/alumno/actualizar/{id}(id=${alumno.id})} : 
                         @{/alumno/guardar}" 
              th:object="${alumno}" method="post">

            <div class="form-group">
                <label>🆔 RUT:</label>
                <input type="text" th:field="*{rut}" placeholder="12.345.678-9" required>
                <span th:if="${#fields.hasErrors('rut')}" th:errors="*{rut}" class="error"></span>
                <span th:if="${errorRut}" th:text="${errorRut}" class="error"></span>
            </div>

            <div class="form-group">
                <label>👤 Nombre:</label>
                <input type="text" th:field="*{nombre}" placeholder="Nombre del alumno" required>
                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></span>
            </div>

            <div class="form-group">
                <label>👨 Primer Apellido:</label>
                <input type="text" th:field="*{primerApellido}" placeholder="Primer apellido" required>
                <span th:if="${#fields.hasErrors('primerApellido')}" th:errors="*{primerApellido}" class="error"></span>
            </div>

            <div class="form-group">
                <label>👩 Segundo Apellido:</label>
                <input type="text" th:field="*{segundoApellido}" placeholder="Segundo apellido (opcional)">
            </div>

            <div class="form-group">
                <label>📅 Fecha de Nacimiento:</label>
                <input type="date" th:field="*{fechaNacimiento}" required>
                <span th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}" class="error"></span>
            </div>

            <div class="form-group">
                <label>🏠 Dirección:</label>
                <input type="text" th:field="*{direccion}" placeholder="Calle, número, depto" required>
                <span th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}" class="error"></span>
            </div>

            <div class="form-group">
                <label>📍 Comuna:</label>
                <input type="text" th:field="*{comuna}" placeholder="Comuna de residencia" required>
                <span th:if="${#fields.hasErrors('comuna')}" th:errors="*{comuna}" class="error"></span>
            </div>

            <div class="form-group">
                <label>🎓 Carrera:</label>
                <select th:field="*{carrera}" required>
                    <option value="">-- Seleccione una carrera --</option>
                    <option th:each="c : ${carreras}" 
                            th:value="${c}" 
                            th:text="${c.descripcion}"></option>
                </select>
                <span th:if="${#fields.hasErrors('carrera')}" th:errors="*{carrera}" class="error"></span>
            </div>

            <div class="form-group">
                <label>📧 Email:</label>
                <input type="email" th:field="*{email}" placeholder="correo@ejemplo.com" required>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
                <span th:if="${errorEmail}" th:text="${errorEmail}" class="error"></span>
            </div>

            <div class="form-group">
                <label> Teléfono:</label>
                <input type="text" th:field="*{telefono}" placeholder="+56912345678" required>
                <span th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="error"></span>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" th:field="*{matriculado}">
                    ✅ Alumno matriculado
                </label>
            </div>

            <div class="button-group">
                <button type="submit"> Guardar</button>
                <a th:href="@{/alumno/lista}" class="btn-secondary">❌ Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
