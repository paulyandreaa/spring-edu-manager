<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>📝 Registro de Usuario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2> Registro de Usuario</h2>

        <form th:action="@{/guardarRegistro}" th:object="${usuario}" method="post">
            <div class="form-group">
                <label>👤 Username:</label>
                <input type="text" th:field="*{username}" required placeholder="Ej: juanperez">
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error"></span>
                <span th:if="${errorUsername}" th:text="${errorUsername}" class="error"></span>
            </div>
            <div class="form-group">
                <label>📧 Email:</label>
                <input type="email" th:field="*{email}" required placeholder="correo@ejemplo.com">
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
                <span th:if="${errorEmail}" th:text="${errorEmail}" class="error"></span>
            </div>
            <div class="form-group">
                <label>🔑 Contraseña:</label>
                <input type="password" th:field="*{password}" required placeholder="Mínimo 6 caracteres">
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></span>
            </div>
            <button type="submit">✅ Registrarse</button>
        </form>

        <p style="text-align: center; margin-top: 25px;">
            ¿Ya tienes cuenta? <a th:href="@{/login}" style="color: var(--primary); font-weight: 600;">🔐 Inicia sesión</a>
        </p>
    </div>
</body>
</html>
